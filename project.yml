name: GestureKeys
options:
  bundleIdPrefix: com.gesturekeys
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.7.0"

targets:
  GestureKeys:
    type: application
    platform: macOS
    sources:
      - GestureKeys
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gesturekeys.app
        INFOPLIST_FILE: GestureKeys/Info.plist
        CODE_SIGN_ENTITLEMENTS: GestureKeys/GestureKeys.entitlements
        OTHER_LDFLAGS:
          - "-framework"
          - "MultitouchSupport"
        FRAMEWORK_SEARCH_PATHS:
          - /System/Library/PrivateFrameworks
        SWIFT_VERSION: "5"
        DEVELOPMENT_TEAM: "2L4F5S6DCV"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          ENABLE_HARDENED_RUNTIME: false
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          ENABLE_HARDENED_RUNTIME: true
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
